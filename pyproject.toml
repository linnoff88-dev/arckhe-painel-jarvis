[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painel-jarvis"
version = "1.0.1"
description = "O painel da sua máquina e das suas rotinas como plugin de qualquer Jarvis (INTELECTO, MCP) e instalável no celular. Python puro."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
testes = ["pytest>=8"]

[project.scripts]
painel-jarvis = "painel_jarvis.cli:main"

[project.entry-points."intelecto.plugins"]
painel = "painel_jarvis.intelecto_plugin:ferramentas"

[tool.setuptools.packages.find]
include = ["painel_jarvis*"]

[tool.setuptools.package-data]
painel_jarvis = ["painel.exemplo.toml", "web/*.png"]
